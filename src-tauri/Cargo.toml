[package]
name = "orbit-ide"
version = "0.1.0"
description = "Orbit IDE: an offline code editor with Claude, Codex, Grok and OpenRouter built in."
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.9"
base64 = "0.23"
ureq = { version = "2", default-features = false, features = ["json", "native-tls", "gzip"] }
native-tls = "0.2"
notify = "8"
# Find and replace in the project (src/fsops.rs); already built for Tauri.
regex = "1"
# Updates from Orbit Mission Control (src/updates.rs).
tauri-plugin-updater = "2"

# Move to Trash: Finder's own call on the Mac, the Recycle Bin on Windows.
# Both crates already come with Tauri.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Proc-macro libraries built by the release profile are stripped, and current
# macOS refuses to load them ("mis-aligned LINKEDIT string pool"), so a clean
# release build fails. Build-time crates are never shipped; leave them unstripped.
[profile.release.build-override]
strip = false
