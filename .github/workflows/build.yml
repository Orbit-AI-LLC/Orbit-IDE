name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install page libraries
        shell: bash
        run: |
          npm ci
          sh scripts/vendor.sh

      - name: Build macOS app and DMG
        if: runner.os == 'macOS'
        run: |
          sh build_orbit_ide_dmg.sh
          cd "src-tauri/target/release/bundle/macos"
          ditto -c -k --keepParent "Orbit IDE.app" "$GITHUB_WORKSPACE/dist/Orbit-IDE-macOS.app.zip"

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npx --no-install tauri build --bundles nsis
          mkdir -p dist
          cp src-tauri/target/release/bundle/nsis/*-setup.exe dist/Orbit-IDE-Windows-Setup.exe
          cp "src-tauri/target/release/orbit-ide.exe" dist/Orbit-IDE-Windows-portable.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-IDE-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Name the release
        id: meta
        run: |
          version=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=Orbit IDE ${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${version}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "name=Orbit IDE ${version} build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi
          ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*
