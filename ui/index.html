<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit IDE</title>
  <link rel="stylesheet" href="vendor/xterm/xterm.css">
  <link rel="stylesheet" href="app.css">
</head>
<body data-theme="dark">
  <div id="app" class="app">
    <header class="titlebar" data-tauri-drag-region>
      <div class="titlebar-left" data-tauri-drag-region>
        <img class="titlebar-mark" src="mark.svg" alt="" draggable="false">
        <span class="titlebar-project" id="title-project" data-tauri-drag-region>Orbit IDE</span>
      </div>
      <div class="titlebar-center" data-tauri-drag-region>
        <button class="titlebar-search" id="btn-quick-open" title="Go to file (Cmd+P)">
          <svg viewBox="0 0 16 16" width="12" height="12"><circle cx="6.5" cy="6.5" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 10l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span id="quick-open-label">Search files</span>
        </button>
      </div>
      <div class="titlebar-right">
        <button class="icon-btn" id="btn-toggle-terminal" title="Terminal (Cmd+J)"><svg viewBox="0 0 16 16" width="16" height="16"><rect x="1.5" y="2.5" width="13" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 6l2.5 2-2.5 2M8 10.5h3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="icon-btn" id="btn-toggle-ai" title="AI (Cmd+Shift+A)"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1.5l1.6 4.2L14 7.3l-4.4 1.6L8 13.2 6.4 8.9 2 7.3l4.4-1.6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>
        <button class="icon-btn" id="btn-settings" title="Settings (Cmd+,)"><svg viewBox="0 0 16 16" width="16" height="16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M3.6 12.4L5 11M11 5l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
      </div>
    </header>

    <div class="body">
      <nav class="activity" aria-label="Sections">
        <button class="activity-btn active" data-panel="projects" title="Projects (Cmd+1)">
          <svg viewBox="0 0 20 20" width="20" height="20"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 8h15" stroke="currentColor" stroke-width="1.5"/><path d="M6 5.8h.01M9 5.8h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button class="activity-btn" data-panel="files" title="Explorer (Cmd+2)">
          <svg viewBox="0 0 20 20" width="20" height="20"><path d="M5 2.5h6.5L15.5 6.5v11H5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M11.5 2.5v4h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
        <button class="activity-btn" data-panel="git" title="Source control (Cmd+3)">
          <svg viewBox="0 0 20 20" width="20" height="20"><circle cx="6" cy="4.5" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="6" cy="15.5" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="14" cy="7.5" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 6.5v7M14 9.5c0 3-8 2-8 4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
          <span class="activity-badge" id="git-badge" hidden></span>
        </button>
        <div class="activity-spacer"></div>
        <button class="activity-btn" data-panel="search" title="Search in project (Cmd+Shift+F)">
          <svg viewBox="0 0 20 20" width="20" height="20"><circle cx="8.5" cy="8.5" r="5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12.5 12.5l4.5 4.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </nav>

      <aside class="sidebar" id="sidebar">
        <section class="panel active" data-panel="projects">
          <header class="panel-header"><h2>Projects</h2><div class="panel-actions"><button class="icon-btn" id="btn-add-project" title="Open folder">+</button></div></header>
          <div class="panel-body" id="projects-list"></div>
          <div class="panel-hint" id="projects-empty">Open a folder to start. You can also drop a folder onto this window.</div>
        </section>
        <section class="panel" data-panel="files">
          <header class="panel-header"><h2 id="files-title">Explorer</h2><div class="panel-actions">
            <button class="icon-btn" id="btn-new-file" title="New file">+</button>
            <button class="icon-btn" id="btn-new-folder" title="New folder">▭</button>
            <button class="icon-btn" id="btn-refresh-files" title="Refresh">↻</button>
          </div></header>
          <div class="panel-body tree" id="file-tree"></div>
        </section>
        <section class="panel" data-panel="git">
          <header class="panel-header"><h2>Source control</h2><div class="panel-actions">
            <button class="icon-btn" id="btn-git-refresh" title="Refresh">↻</button>
          </div></header>
          <div class="panel-body" id="git-panel"></div>
        </section>
        <section class="panel" data-panel="search">
          <header class="panel-header"><h2>Search</h2></header>
          <div class="search-box"><input type="search" id="search-input" placeholder="Find in project" spellcheck="false"></div>
          <div class="panel-body" id="search-results"></div>
        </section>
      </aside>
      <div class="gutter gutter-v" id="gutter-sidebar"></div>

      <main class="main">
        <div class="tabs" id="editor-tabs"></div>
        <div class="editor-area">
          <div class="editor-host" id="editor"></div>
          <div class="editor-host" id="diff-editor" hidden></div>
          <div class="welcome" id="welcome">
            <div class="welcome-mark" role="img" aria-label="Orbit IDE"></div>
            <h1>Orbit IDE</h1>
            <p>Open a project, then write with Claude Code, Codex, Grok or OpenRouter beside your code.</p>
            <div class="welcome-keys">
              <div><kbd>⌘P</kbd> Go to file</div>
              <div><kbd>⌘⇧F</kbd> Find in project</div>
              <div><kbd>⌘J</kbd> Terminal</div>
              <div><kbd>⌘⇧A</kbd> AI dock</div>
            </div>
          </div>
        </div>
        <div class="gutter gutter-h" id="gutter-terminal" hidden></div>
        <section class="terminal-panel" id="terminal-panel" hidden>
          <header class="terminal-header">
            <div class="terminal-tabs" id="terminal-tabs"></div>
            <div class="panel-actions">
              <button class="icon-btn" id="btn-new-terminal" title="New terminal">+</button>
              <button class="icon-btn" id="btn-close-terminal-panel" title="Hide (Cmd+J)">×</button>
            </div>
          </header>
          <div class="terminal-body" id="terminal-body"></div>
        </section>
      </main>

      <div class="gutter gutter-v" id="gutter-ai"></div>
      <aside class="ai-dock" id="ai-dock">
        <header class="ai-header">
          <div class="ai-tabs" id="ai-tabs"></div>
          <div class="panel-actions" id="ai-actions"></div>
        </header>
        <div class="ai-body" id="ai-body"></div>
      </aside>
    </div>

    <footer class="statusbar">
      <div class="status-left">
        <button class="status-item" id="status-branch" title="Branch"></button>
        <span class="status-item" id="status-sync"></span>
      </div>
      <div class="status-right">
        <span class="status-item" id="status-message"></span>
        <span class="status-item" id="status-cursor"></span>
        <button class="status-item" id="status-language"></button>
      </div>
    </footer>
  </div>

  <div class="overlay" id="overlay" hidden></div>
  <div class="context-menu" id="context-menu" hidden></div>
  <div class="toasts" id="toasts"></div>

  <script src="vendor/monaco/vs/loader.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
